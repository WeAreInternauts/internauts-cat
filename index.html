<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internauts Cat — Embed Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #efefef;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: #222;
    }
    h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
    code {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 20px;
      font: 13px/1.6 ui-monospace, monospace;
      color: #432261;
    }
    p { font-size: 0.85rem; color: #666; }

<body>
  <h1>Internauts Cat</h1>
  <p>Move your mouse around. Hold still near the center to trigger ambush.</p>
